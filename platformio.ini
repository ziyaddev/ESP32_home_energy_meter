; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
; Firmware (~1.4 MB with Arduino core 3.x) no longer fits the default 1.25 MB app slot.
; min_spiffs: 2 x 1.875 MB OTA slots, NVS unchanged (WiFi creds kept), SPIFFS 128 KB.
board_build.partitions = min_spiffs.csv
lib_deps = 
	miq19/eModbus@^1.7.4
	https://github.com/me-no-dev/ESPAsyncWebServer.git
	esp32async/AsyncTCP@^3.4.10
	tobiasschuerg/ESP8266 Influxdb@^3.13.2
	https://github.com/ziyaddev/ESP32_IoT_Dashboard.git